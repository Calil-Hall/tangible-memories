<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Tangible Memories</title>
<meta name="description" content="Instant prints from events photographed by Tangible Memories — every one printed once and handed to a guest on the spot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<!-- server.js copies index.html's <style> block in here, so this page always
     matches the homepage. The images below are filled in from assets/gallery/. -->
<!-- SITE:STYLE -->
<style>
.g-head{padding:52px 0 26px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;}
.g-head h1{font-size:64px;line-height:.95;margin:0;letter-spacing:-.02em;}
.g-head p{margin:10px 0 0;font-size:17px;color:var(--color-neutral-700);max-width:46ch;}
/* Justified rows: each print keeps its shape, rows fill the width, and the
   order reads left to right (newest first). --r is the print's width/height. */
.g-grid{display:flex;flex-wrap:wrap;gap:18px;}
.g-grid::after{content:"";flex-grow:999;}
.g-item{display:block;flex-grow:var(--r);flex-basis:calc(var(--r) * 230px);max-width:calc(var(--r) * 360px);
  border-radius:3px;box-shadow:var(--shadow-md);transition:transform .15s ease;}
.g-item:hover{transform:translateY(-3px) rotate(-.4deg);}
.g-item:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px;}
.g-item img{display:block;width:100%;height:auto;border-radius:3px;background:var(--color-neutral-200);}
.g-cta{margin:46px 0 10px;text-align:center;}
.lb{border:0;padding:0;background:transparent;max-width:94vw;max-height:94vh;}
.lb::backdrop{background:rgba(20,18,16,.88);}
.lb img{display:block;max-width:94vw;max-height:88vh;width:auto;height:auto;border-radius:3px;}
.lb-close{position:fixed;top:14px;right:14px;width:48px;height:48px;border-radius:999px;border:0;
  background:var(--color-neutral-100);color:var(--color-text);font-size:24px;cursor:pointer;}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;
  border:0;background:var(--color-neutral-100);color:var(--color-text);font-size:20px;cursor:pointer;}
.lb-prev{left:14px;} .lb-next{right:14px;}
@media (max-width:900px){ .g-head h1{font-size:44px;} .g-grid{gap:10px;} .g-item{flex-basis:calc(var(--r) * 120px);} }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="nav-brand" href="/" style="color:inherit;text-decoration:none">
      <span class="nav-badge">T</span>
      <span class="nav-word">Tangible Memories</span>
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#prices">Package</a>
      <a href="/#contact">Contact</a>
      <a href="/#book" class="btn btn-primary">Book your event</a>
    </div>
  </nav>

  <header class="g-head">
    <div>
      <h1>Gallery</h1>
      <p><!-- GALLERY:COUNT --> prints, newest first. Each one was printed once and handed to a guest on the spot. Tap any print to see it larger.</p>
    </div>
  </header>

  <main class="g-grid" id="grid">
      <!-- GALLERY:ALL -->
  </main>

  <div class="g-cta"><a href="/#book" class="btn btn-primary">Book your event</a></div>
  <div class="footer-admin"><a href="/admin" rel="nofollow">Admin login</a></div>
</div>

<dialog class="lb" id="lb" aria-label="Enlarged print">
  <img id="lbImg" alt="">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous print">&#8592;</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next print">&#8594;</button>
</dialog>

<script>
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll(".g-item"));
  var lb = document.getElementById("lb"), im = document.getElementById("lbImg"), at = 0;
  if (!lb.showModal) return; // very old browser: links just open the image
  function show(i){ at = (i + links.length) % links.length; im.src = links[at].href;
    im.alt = links[at].querySelector("img").alt; }
  links.forEach(function(a, i){ a.addEventListener("click", function(e){
    e.preventDefault(); show(i); lb.showModal(); }); });
  document.getElementById("lbClose").onclick = function(){ lb.close(); };
  document.getElementById("lbPrev").onclick = function(){ show(at - 1); };
  document.getElementById("lbNext").onclick = function(){ show(at + 1); };
  lb.addEventListener("click", function(e){ if (e.target === lb) lb.close(); });
  document.addEventListener("keydown", function(e){
    if (!lb.open) return;
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  });
})();
</script>
</body>
</html>
